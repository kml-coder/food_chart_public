services:
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: food-chart-backend
    ports:
      - "5050:5050"
    environment:
      # [LOCAL-ONLY MODE] old host setting kept for reference:
      # - OLLAMA_URL=http://host.docker.internal:11434/api/chat
      - OLLAMA_URL=http://localhost:11434/api/chat
      - OLLAMA_MODEL=phi3
      - USE_OLLAMA_GRAMS=true
      - DEBERTA_MODEL_PATH=/app/deberta_model
    volumes:
      - ./food_server/model:/app/model:ro
      - ./food_model/gptgram_model/artifacts/deberta_v3_base_grams_text_input_final:/app/deberta_model:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: food-chart-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
